name: Bug 反馈
description: 报告 QuizMate 安装、CLI / API 连接、题目识别或填写问题。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索已有 Issues，并尽量提供最小复现步骤。
        **这是公开表单，请勿上传 API Key、加密口令、密文、令牌、Cookie、账号配置或个人数据。**
        安全漏洞请使用仓库 Security 页的私密报告入口，不要公开披露。
  - type: input
    id: extension-version
    attributes:
      label: QuizMate 扩展版本
      description: 可在 chrome://extensions 或 edge://extensions 查看。
      placeholder: 例如 0.4.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统
      options:
        - macOS
        - Linux
        - Windows
        - 其他
    validations:
      required: true
  - type: input
    id: runtime-versions
    attributes:
      label: 系统 / Chrome 或 Edge / Node.js 版本（API 模式无需 Node.js）
      placeholder: 请填写具体版本
    validations:
      required: true
  - type: dropdown
    id: cli-provider
    attributes:
      label: 连接方式 / CLI
      options:
        - API 模式（OpenAI 兼容）
        - Codex CLI
        - Claude Code CLI
        - Gemini CLI
        - Qwen Code CLI
        - Kimi CLI
        - 多个 CLI 均有问题
        - 尚未调用 CLI / 与 CLI 无关
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: CLI 版本或 API 协议 / 模型
      description: 本地模式可补充 ccSwitch 版本；API 模式请填写 Chat Completions / Responses 和模型 ID，不要粘贴密钥或登录配置。
  - type: input
    id: page-url
    attributes:
      label: 相关页面（可选）
      description: 仅提供允许公开的地址，删除查询参数中的令牌、账号和个人信息。
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 可附脱敏截图；请不要上传不允许公开的题目或账号内容。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志（可选）
      description: 可提供扩展任务记录或 doctor 结果；删除令牌、个人路径和私有地址。
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查截图和日志，不包含密钥、登录凭证或个人隐私。
          required: true
